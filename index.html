<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thrift for Corina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thrift for Corina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150f" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#faf8f5; --card:#fff; --ink:#1f1d1a; --muted:#6b665f; --line:#e6e1d9; --accent:#b4451f; --accent-ink:#fff;
  --chip:#f1ece4; --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#9a5b00; --warn-bg:#fdf0d5; --bad:#8a3a2a; --bad-bg:#f6e3dd;
  --land:#efe9df; --land-line:#fff; --dlabel:#a89f90; --lm:#6b665f; --sel:#1f1d1a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17150f; --card:#201d16; --ink:#f1ece4; --muted:#a39d92; --line:#352f25; --accent:#e8774d; --accent-ink:#1a0d06;
    --chip:#2a251c; --ok:#6fd3a0; --ok-bg:#183626; --warn:#f0bd62; --warn-bg:#3b2d10; --bad:#f0a38e; --bad-bg:#3a201a;
    --land:#26221a; --land-line:#17150f; --dlabel:#6f675a; --lm:#a39d92; --sel:#f1ece4;
  }
}
:root[data-theme="dark"]{
  --bg:#17150f; --card:#201d16; --ink:#f1ece4; --muted:#a39d92; --line:#352f25; --accent:#e8774d; --accent-ink:#1a0d06;
  --chip:#2a251c; --ok:#6fd3a0; --ok-bg:#183626; --warn:#f0bd62; --warn-bg:#3b2d10; --bad:#f0a38e; --bad-bg:#3a201a;
  --land:#26221a; --land-line:#17150f; --dlabel:#6f675a; --lm:#a39d92; --sel:#f1ece4;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header.top{flex:none;padding:10px 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
header.top h1{margin:0;font-size:1.2rem;line-height:1.2}
header.top .sub{color:var(--muted);font-size:.8rem;margin-top:2px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}
#v-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 24px}
.filters{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pad{padding:0 12px}
.hint{color:var(--muted);font-size:.82rem;margin:10px 4px}
details.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
details.card>summary{list-style:none;display:grid;grid-template-columns:40px 1fr auto;gap:2px 12px;align-items:center;padding:12px;min-height:64px;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
.num{grid-row:1/3;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.nm{font-weight:650;line-height:1.25;font-size:1rem}
.rt{grid-row:1/3;text-align:right;line-height:1.15;font-size:.8rem;color:var(--muted)}
.rt b{display:block;font-size:1.1rem;color:var(--ink)}
.sub2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.st{border-radius:6px;padding:1px 7px;font-weight:600;font-size:.75rem}
.st.open{background:var(--ok-bg);color:var(--ok)}
.st.closed{background:var(--bad-bg);color:var(--bad)}
.st.soon{background:var(--warn-bg);color:var(--warn)}
.body{padding:0 14px 14px;border-top:1px solid var(--line)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.tag{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:.78rem;color:var(--muted)}
.addr{margin:8px 0 2px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.btn{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:.9rem;text-decoration:none;text-align:center;padding:0 6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.off{opacity:.45;pointer-events:none}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 4px}
table.h{border-collapse:collapse;width:100%;font-size:.95rem}
table.h td{padding:3px 0}
table.h td:first-child{color:var(--muted);width:5.5em}
table.h tr.today td{font-weight:700;color:var(--ink)}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:.78rem;font-weight:600;margin-top:8px}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)}
.snote{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.notes{font-size:.95rem;margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px 6px;margin-top:6px}
.links a{display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:.8rem;text-decoration:none}
.links a.soc{color:var(--accent)}
details.method{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0 12px}
details.method summary{font-weight:600;min-height:28px;cursor:pointer}
details.method li,details.method p{color:var(--muted);font-size:.88rem;margin:.5em 0}
h2.sec{font-size:1.05rem;margin:22px 4px 8px}
.cons{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.cons div{padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.cons div:last-child{border-bottom:0}
.cons b{display:block}
.cons span{color:var(--muted)}
.foot{color:var(--muted);font-size:.8rem;margin:16px 4px}
/* map view */
#v-map{display:none;flex-direction:column}
#v-map.active{display:flex}
.strip{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.nchip{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--card);color:var(--accent);font:inherit;font-weight:700}
.nchip.sel{background:var(--accent);color:var(--accent-ink)}
#mapwrap{flex:1;min-height:0;position:relative;background:var(--card);overflow:hidden}
svg#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:2;vector-effect:non-scaling-stroke}
.dl{fill:var(--dlabel);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lmk circle{fill:var(--lm)} .lmk text{fill:var(--lm);font-style:italic}
.pin circle.dot{fill:var(--accent);stroke:#fff;stroke-width:2}
.pin text{fill:var(--accent-ink);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.sel circle.dot{stroke:var(--sel);stroke-width:3}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.3rem}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.sheet .t{font-weight:700;font-size:1rem;line-height:1.25}
.sheet .m{color:var(--muted);font-size:.85rem;margin:2px 0 8px}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .nav{display:flex;gap:8px;margin-top:8px}
.sheet .nav .btn{flex:1}
.mapnote{font-size:.72rem;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line);flex:none}
nav.tabs{flex:none;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--bg)}
nav.tabs button{min-height:56px;border:0;background:none;color:var(--muted);font:inherit;font-size:.82rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button span{font-size:1.25rem;line-height:1}
nav.tabs button.on{color:var(--accent)}

.pad .sortrow{display:flex;align-items:center;gap:8px;margin:10px 0 6px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.schip{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem}
.schip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.dist{font-size:.78rem;color:var(--muted)}
.findme{position:absolute;left:10px;top:10px;min-height:46px;padding:0 16px;border-radius:23px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:.9rem;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);max-width:min(92vw,420px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.88rem;z-index:50;display:none;text-align:center}

header.top{padding-top:12px;padding-bottom:10px}
header.top h1{font-family:"Lobster","Snell Roundhand","Brush Script MT",cursive;font-weight:400;font-size:clamp(2.3rem,10.5vw,2.9rem);line-height:1.05;color:var(--accent);letter-spacing:.01em;-webkit-text-stroke:1px var(--accent)}
.loc{display:flex;align-items:center;gap:5px;font-size:.95rem;font-weight:600;color:var(--accent);margin-top:10px}
.dirback{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none}
.dirsheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;z-index:61;display:none;gap:8px;flex-direction:column}
.dirsheet .t{font-weight:700;margin-bottom:2px}
.dirback.show{display:block}.dirsheet.show{display:flex}
.ver{flex:none;text-align:center;font-size:.7rem;color:var(--muted);padding:2px 0 3px;background:var(--bg)}
.nomatch{display:none;text-align:center;color:var(--muted);font-size:1rem;padding:28px 12px;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.nchip.h{border-radius:10px;border-color:var(--ink);color:var(--ink)}
.nchip.h.sel{background:var(--ink);color:var(--bg)}
.hotel .hbox{fill:var(--ink);stroke:#fff;stroke-width:2}
.hotel text{fill:var(--bg);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hotel.sel .hbox{stroke:var(--accent);stroke-width:3}
.me .acc{fill:rgba(30,120,255,.14);stroke:rgba(30,120,255,.5);stroke-width:1;vector-effect:non-scaling-stroke}
.me .dot{fill:#1e78ff;stroke:#fff;stroke-width:3}

details.card>summary{display:block;grid-template-columns:none;gap:0;list-style:none;padding:12px;min-height:64px;text-align:left}
.sg{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:12px;row-gap:3px;align-items:start;text-align:left}
.sg .num{grid-column:1;grid-row:1 / span 2;align-self:start}
.sg .nm{grid-column:2;grid-row:1;text-align:left;justify-self:start;align-self:center;min-height:40px;display:flex;align-items:center}
.sg .rt{grid-column:3;grid-row:1 / span 2;text-align:right}
.sg .sub2{grid-column:2;grid-row:2;justify-content:flex-start;text-align:left}
.badge.gonly{background:var(--chip);color:var(--muted)}
header.top{position:relative}
.home{position:absolute;top:12px;right:14px;width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--accent);padding:0;cursor:pointer}
.locrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chg{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.82rem;font-weight:600}
.picker{padding:22px 16px;overflow-y:auto}
.picker h2{font-size:1.05rem;margin:0 0 14px;color:var(--muted);font-weight:600}
#citybtns{display:flex;flex-direction:column;gap:14px}
.city{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:165px;text-align:left;border:2px solid;border-radius:22px;padding:18px;font:inherit;cursor:pointer;position:relative}
.city .txt{min-width:0;flex:1}
.city .cn{font-size:clamp(1.1rem,5.6vw,1.6rem);font-weight:700;line-height:1.15}
.city .cc{font-size:clamp(.95rem,4vw,1.1rem);margin-top:3px;opacity:.9}
.city .ct{font-size:.85rem;margin-top:14px;opacity:.8}
.city .shape{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:40%;max-width:190px}
.city .shp{position:relative;width:min(100%,calc(var(--w) * 1.7px))}
.city .ol{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.city .pinm{position:absolute;width:22px;height:27.5px;transform:translate(-50%,-95%);pointer-events:none}
.city .pinm svg{display:block;width:22px;height:27.5px}
header.top.onpicker .sub{margin-top:9px}
.city.vienna{background:#fbe4e1;border-color:#d9776d;color:#8a2b22}
.city.thessaloniki{background:#e0ecfa;border-color:#6f9fd8;color:#1f4f8a}

tage Fashion", "district": "7 · Neubau", "tags": ["True 50s–70s vintage"], "rating": 4.1, "reviews": 42, "addr": "Neubaugasse 78, 1070 Wien", "phone": "+43 676 7676869", "hours": [["Mon–Fri", "10:00–19:00"], ["Sat", "10:00–18:00"], ["Sun", "Closed"]], "sched": [[[600, 1140]], [[600, 1140]], [[600, 1140]], [[600, 1140]], [[600, 1140]], [[600, 1080]], []], "status": "warn", "status_label": "Sources disagree", "status_note": "This is Google's current listing. A 2026 Vienna Würstelstand guide and a Wanderlog snapshot instead show Wed–Sat 12:00–18:00 only, while older directories show Mon–Sat 10:00–19:00. Call before going. Phone is from older directories.", "notes": "Specialist in genuine 1950s–70s pieces (dresses, some traditional Austrian dress, bold men's shirts); local guides compare the shop to a film set. Reviewers split: one calls the prices and pieces excellent for true 50s–70s fans, another says much of the stock is polyester. Not for Y2K shoppers. Lowest Google rating of the boutiques on this list.", "sources": [["Vienna Würstelstand", "https://viennawurstelstand.com/guide/viennas-secondhand-gems-9-thrift-stores-worth-exploring/"], ["Wanderlog", "https://wanderlog.com/place/details/4627329/purple-cave-vintage-fashion"], ["The Vintage Map", "https://thevintagemap.com/vintage/purple-cave-vintage/"]], "social": [], "gmaps": "https://www.google.com/maps/search/?api=1&query=Purple%20Cave%20Vintage%20Fashion%20Neubaugasse%2078%2C%201070%20Wien&query_place_id=ChIJ-X_ww5IHbUcRuI4pQAcpiXM", "cats": ["vintage"], "lat": 48.2050409, "lon": 16.3491888, "pid": "ChIJ-X_ww5IHbUcRuI4pQAcpiXM"}, {"n": 17, "name": "Second Hand Krugerstraße 10", "district": "1 · Innere Stadt", "tags": ["Consignment", "Luxury designer"], "rating": 4.1, "reviews": 100, "addr": "Krugerstraße 10, 1010 Wien", "phone": "+43 664 2030432", "hours": [["Mon–Sat", "10:00–18:00"], ["Sun", "Closed"]], "sched": [[[600, 1080]], [[600, 1080]], [[600, 1080]], [[600, 1080]], [[600, 1080]], [[600, 1080]], []], "status": "warn", "status_label": "Official differs from Google", "status_note": "The shop's own website and Herold say 10:00–18:00 Mon–Sat. Google shows 11:00 opening. Shown here: the official hours.", "notes": "Pre-owned luxury and designer women's fashion just off Stephansplatz (older listings call it First Fashion Second Hand). A reviewer says to expect €80+ for most items, with most pieces looking new. Service reviews are mixed.", "sources": [["Official site", "https://www.secondhandkrugerstrasse.com/en/info"], ["Herold", "https://www.herold.at/gelbe-seiten/wien/GrPg4/second-hand-bekleidungshandel-gesmbh/"]], "social": [], "gmaps": "https://www.google.com/maps/search/?api=1&query=Second%20Hand%20Krugerstra%C3%9Fe%2010%20Krugerstra%C3%9Fe%2010%2C%201010%20Wien&query_place_id=ChIJTZYTSZwHbUcRRfbB3wP45Cw", "cats": ["designer"], "lat": 48.2037899, "lon": 16.3716555, "pid": "ChIJTZYTSZwHbUcRRfbB3wP45Cw"}, {"n": 18, "name": "carla Mittersteig (Caritas)", "district": "5 · Margareten", "tags": ["Charity thrift", "Furniture & household"], "rating": 4.2, "reviews": 2740, "addr": "Mittersteig 10, 1050 Wien", "phone": "+43 5 178 033 10", "hours": [["Mon–Fri", "09:00–18:00"], ["Sat", "09:00–17:00"], ["Sun", "Closed"]], "sched": [[[540, 1080]], [[540, 1080]], [[540, 1080]], [[540, 1080]], [[540, 1080]], [[540, 1020]], []], "status": "ok", "status_label": "Verified", "status_note": "carla's own website, Herold, the City of Vienna social directory and Google all agree. One directory (Cylex) shows 09:00–13:00, which is outdated.", "notes": "Caritas charity thrift in 4,000 m² across four halls: furniture, household goods, clothing, books, vinyl, even pianos. Proceeds fund jobs for long-term unemployed people. By far the most popular on this list (2,700+ reviews), and a queue sometimes forms before opening. Reviewers say bargains are real but it isn't always the cheapest, and some large furniture sits for a long time. Sister shop: carla Nord, also on this list.", "sources": [["Official site", "https://www.carla-wien.at/carla-shops/carla-mittersteig/"], ["Herold", "https://www.herold.at/gelbe-seiten/wien/Gs6JL/carla-mittersteig/"], ["Wien Sozialinfo", "https://www.wien.gv.at/sozialinfo/content/en/10/InstitutionDetail.do?it_1=2097746"]], "social": [], "gmaps": "https://www.google.com/maps/search/?api=1&query=carla%20Mittersteig%20Mittersteig%2010%2C%201050%20Wien&query_place_id=ChIJ-QCVn4AHbUcRMhvJTxhGkgM", "cats": ["charity"], "lat": 48.1912903, "lon": 16.3631154, "pid": "ChIJ-QCVn4AHbUcRMhvJTxhGkgM"}, {"n": 19, "name": "HUMANA Vintage & Secondhand (Lerchenfelder Straße)", "district": "7 · Neubau", "tags": ["Charity chain", "Vintage floor"], "rating": 4.1, "reviews": 374, "addr": "Lerchenfelder Straße 45–47, 1070 Wien", "phone": "+43 664 4226089", "hours": [["Mon–Fri", "10:00–19:00"], ["Sat", "10:00–18:00"], ["Sun", "Closed"]], "sched": [[[600, 1140]], [[600, 1140]], [[600, 1140]], [[600, 1140]], [[600, 1140]], [[600, 1080]], []], "status": "ok", "status_label": "Verified", "status_note": "HUMANA's own Vienna branch page and Google agree. A few older or third-party listings (im7ten, Yelp) show 11:00 openings and earlier closing, which look out of date.", "notes": "The vintage-focused branch of the HUMANA charity chain (proceeds fund development projects): originals from the 50s–90s, evening wear, sportswear and young fashion, at very low prices. Local guides name it among the best HUMANA shops; reviewers say you have to dig through cheap polyester to find gems, but the vintage selection is the strongest of the Humana shops. Cash or card. Other HUMANA branches (Taborstraße 20a, Löwengasse 37, Chwallagasse 4) exist but aren't rated here.", "sources": [["HUMANA Vienna branches", "https://humana.at/filialen/filialuebersicht/wien/"], ["im7ten", "https://www.im7ten.com/entdecken/humana/"], ["Vienna Würstelstand", "https://viennawurstelstand.com/guide/viennas-secondhand-gems-9-thrift-stores-worth-exploring/"]], "social": [], "gmaps": "https://www.google.com/maps/search/?api=1&query=HUMANA%20Vintage%20%26%20Secondhand%20Lerchenfelder%20Stra%C3%9Fe%2045%E2%80%9347%2C%201070%20Wien&query_place_id=ChIJp_2uLpMHbUcRrbSqYTS4T9A", "cats": ["charity", "vintage"], "lat": 48.2062837, "lon": 16.3492741, "pid": "ChIJp_2uLpMHbUcRrbSqYTS4T9A"}, {"n": 20, "name": "carla Nord (Caritas)", "district": "21 · Floridsdorf", "tags": ["Charity thrift", "Furniture & household"], "rating": 4.1, "reviews": 1529, "addr": "Steinheilgasse 3, 1210 Wien", "phone": "+43 1 259 85 77", "hours": [["Mon–Fri", "09:00–18:00"], ["Sat", "09:00–17:00"], ["Sun", "Closed"]], "sched": [[[540, 1080]], [[540, 1080]], [[540, 1080]], [[540, 1080]], [[540, 1080]], [[540, 1020]], []], "status": "ok", "status_label": "Verified", "status_note": "carla's own site, the City of Vienna social directory and Google agree. Google's pin says 3A, but carla lists 3A as the separate carla Depot (office furniture, Mon–Fri 9–15) next door. Some directories show Saturday 9–13, which is outdated.", "notes": "Caritas charity thrift in three halls (over 4,000 m²) in Floridsdorf: furniture, household goods, clothes, books, toys, vinyl; even non-roadworthy cars can be donated or bought as project cars, per carla. Reviews are more mixed than Mittersteig: one regular found it less organised, and the kids' section was messy, but the porcelain and ceramics shelves are worth a look. Far north of the centre (21st district).", "sources": [["Official site", "https://www.carla-wien.at/carla-shops/carla-nord/"], ["Wiener carlas overview", "https://www.carla-wien.at/wiener-carlas/"], ["Wien Sozialinfo", "https://sozialinfo.wien.at/content/en/10/InstitutionDetail.do?it_1=2097865"]], "social": [], "gmaps": "https://www.google.com/maps/search/?api=1&query=carla%20Nord%20Steinheilgasse%203%2C%201210%20Wien&query_place_id=ChIJfw3siYAGbUcRO0_zA4e87LE", "cats": ["charity"], "lat": 48.2640909, "lon": 16.412344, "pid": "ChIJfw3siYAGbUcRO0_zA4e87LE"}], "hotel": {"name": "Hotel Regina", "pid": "ChIJ3c89x7 )", "district": "546 22", "tags": ["Vintage", "Thrift", "E-shop"], "rating": 5.0, "reviews": 82, "addr": "Paleon Patron Germanou 24, 546 22 Thessaloniki", "phone": "+30 231 025 1580", "hours": [["Mon–Fri", "10:00–21:00"], ["Sat", "10:00–18:00"], ["Sun", "Closed"]], "sched": [[[600, 1260]], [[600, 1260]], [[600, 1260]], [[600, 1260]], [[600, 1260]], [[600, 1080]], []], "status": "gonly", "status_label": "Google hours only", "status_note": "Hours come from Google Maps only; I couldn't find a second source (the shop's site or social page doesn't list them).", "notes": "Same shop family as the Delfon branch, with a retro-furniture changing area at the back. Men's, women's, newer second-hand (Tommy Hilfiger, North Face) and true vintage at affordable prices. Reviewers praise the staff and the owner, who also runs an online shop.", "sources": [], "social": [], "gmaps": "https://www.google.com/maps/search/?api=1&query=Zygise%20to%20Foresete%20to%20Paleon%20Patron%20Germanou%2024%2C%20546%2022%20Thessaloniki&query_place_id=ChIJ7_qo52g5qBQRUPDQ4gvtPCU", "cats": ["vintage", "thrift"], "lat": 40.631349199999995, "lon": 22.948095499999997, "pid": "ChIJ7_qo52g5qBQRUPDQ4gvtPCU"}, {"n": 6, "name": "Jenny Blond Vintage", "district": "546 25", "tags": ["Vintage", "Colour-sorted"], "rating": 4.9, "reviews": 273, "addr": "Siggrou 5, 546 25 Thessaloniki", "phone": "+30 231 601 4100", "hours": [["Mon, Wed", "10:00–15:00"], ["Tue, Thu, Fri", "12:00–20:00"], ["Sat", "11:00–16:00"], ["Sun", "Closed"]], "sched": [[[600, 900]], [[720, 1200]], [[600, 900]], [[720, 1200]], [[720, 1200]], [[660, 960]], []], "status": "gonly", "status_label": "Google hours only", "status_note": "Hours come from Google Maps only; I couldn't find a second source (the shop's site or social page doesn't list them).", "notes": "Mostly women's vintage, sorted by colour: silk shirts, denim, scarves, swimwear and some niche pieces, plus a little menswear. A reviewer paid about €15–35 a shirt and called the quality high;  "gonly", "status_label": "Google hours only", "status_note": "Hours come from Google Maps only; I couldn't find a second source (the shop's site or social page doesn't list them).", "notes": "Vintage clothing spread across several rooms, with friendly owners who share city tips. Reviewers mention a second location nearby that has a bar. One notes the stock runs mostly small sizes.", "sources": [], "social": [], "gmaps": "https://www.google.com/maps/search/?api=1&query=Oldd%20Fashion%3A%20Vintage%20Clothing%20Kon/nou%20Melenikou%205%2C%20546%2035%20Thessaloniki&query_place_id=ChIJF8Mo3cs5qBQRgKUNNOpI6Rg", "cats": ["vintage"], "lat": 40.6321478, "lon": 22.9535138, "pid": "ChIJF8Mo3cs5qBQRgKUNNOpI6Rg"}, {"n": 12, "name": "V for Vintage (women's)", "district": "546 35", "tags": ["Vintage", "Menswear across the street"], "rating": 4.7, "reviews": 120, "addr": "Armenopoulou 29, 546 35 Thessaloniki", "phone": "+30 697 560 2354", "hours": [["Mon–Fri", "11:00–20:00"], ["Sat", "11:00–17:00"], ["Sun", "Closed"]], "sched": [[[660, 1200]], [[660, 1200]], [[660, 1200]], [[660, 1200]], [[660, 1200]], [[660, 1020]], []], "status": "gonly", "status_label": "Google hours only", "status_note": "Hours come from Google Maps only; I couldn't find a second source (the shop's site or social page doesn't list them). The men's and unisex shop opposite (No. 32) shows Mon–Fri 11:00–20:00 and Sat 11:00–18:00.", "notes": "Two shops on opposite sides of the street: women's at No. 29 and men's/unisex at No. 32 (4.9 on Google from 49 reviews). Reviewers praise the owners (Helen and Nick), the quality and the sorted racks. Opinions on prices are split, from a bargain at end-of-season to a complaint about brand-name pricing.", "sources": [["City Lockers guide", "https://blog.citylockers.gr/en/shopping-in-thessaloniki-the-thrift-shop-project/"]], "social": [], "gmaps": "https://www.google.com/maps/search/?api=1&query=V%20for%20Vintage%20Armenopoulou%2029%2C%20546%2035%20Thessaloniki&query_place_id=ChIJDdDM-ww5qBQRNgRAYPVR0Zc", "cats": ["vintage"], "lat": 40.633617699999995, "lon": 22.9540398, "pid": "ChIJDdDM-ww5qBQRNgRAYPVR0Zc"}, {"n": 13, "name": "Vaudeville Room", "district": "546 31", "tags": ["Vintage", "Converted house"], "rating": 4.6, "reviews": 36, "addr": "Filippou 40, 546 31 Thessaloniki", "phone": "+30 231 028 4108", "hours": [["Mon, Wed, Sat", "12:00–16:00"], ["Tue, Thu, Fri", "12:00–19:00"], ["Sun", "Closed"]], "sched": [[[720, 960]], [[720, 1140]], [[720, 960]], [[720, 1140]], [[720, 1140]], [[720, 960]], []], "status": "warn", "status_label": "Hours unreliable", "status_note": "Google shows these hours, but one reviewer came back day after day to a closed shop with no sign. Another says to ring the doorbell on the left to get in. Call first.", "notes": "Vintage in a converted house, with stock spread over several rooms, run by Nana and Elias, who share the history of pieces. Reviewers call it one of the better vintage shops in the city, with reasonable prices, though there isn't much for men. Only 36 Google reviews.", "sources": [["Wanderlog", "https://wanderlog.com/place/details/5354141/vaudeville-room"]], "social": [], "gmaps": "https://www.google.com/maps/search/?api=1&query=Vaudeville%20Room%20Filippou%2040%2C%20546%2031%20Thessaloniki&query_place_id=ChIJZ32K36g5qBQRKqB8PScIxF0", "cats": ["vintage"], "lat": 40.6361523, "lon": 22.9472786, "pid": "ChIJZ32K36g5qBQRKqB8PScIxF0"}, {"n": 14, "name": "Zygise to Foresete to (Delfon)", "district": "546 41", "tags": ["Vintage", "Thrift"], "rating": 4.6, "reviews": 85, "addr": "Delfon 48, 546 41 Thessaloniki", "phone": "+30 231 129 2707", "hours": [["Mon–Fri", "09:30–21:00"], ["Sat", "10:00–18:00"], ["Sun", "Closed"]], "sched": [[[570, 1260]], [[570, 1260]], [[570, 1260]], [[570, 1260]], [[570, 1260]], [[600, 1080]], []], "status": "gonly", "status_label": "Google hours only", "status_note": "Hours come from Google Maps only; I couldn't find a second source (the shop's site or social page doesn't list ge", "Designer picks"], "rating": 4.6, "reviews": 129, "addr": "Valaoritou 20, 546 25 Thessaloniki", "phone": "+30 698 418 6566", "hours": [["Mon–Fri", "12:00–21:00"], ["Sat, Sun", "Closed"]], "sched": [[[720, 1260]], [[720, 1260]], [[720, 1260]], [[720, 1260]], [[720, 1260]], [], []], "status": "gonly", "status_label": "Google hours only", "status_note": "Hours come from Google Maps only; I couldn't find a second source (the shop's site or social page doesn't list them).", "notes": "The smaller, older branch of Sold Out: handpicked vintage and designer items in the Valaoritou area. A reviewer says pieces run about €25–30 and condition isn't always the best, while others call the picks and prices good. The staff give local recommendations.", "sources": [["Sold Out Stores", "https://soldoutstores.gr"]], "social": [], "gmaps": "https://www.google.com/maps/search/?api=1&query=Sold%20Out%20Thrift%20Stores%20Valaoritou%2020%2C%20546%2025%20Thessaloniki&query_place_id=ChIJZ29TFkc5qBQR7G3gNPqBXDI", "cats": ["vintage", "thrift"], "lat": 40.6380441, "lon": 22.9386742, "pid": "ChIJZ29TFkc5qBQR7G3gNPqBXDI"}, {"n": 17, "name": "Elephant Gang", "district": "546 21", "tags": ["Vintage", "Brands"], "rating": 4.6, "reviews": 180, "addr": "Ippodromiou Square 18, 546 21 Thessaloniki", "phone": "+30 231 027 6611", "hours": [["Mon, Wed", "11:00–16:00"], ["Tue, Thu, Fri", "11:00–21:00"], ["Sat", "09:00–16:00"], ["Sun", "Closed"]], "sched": [[[660, 960]], [[660, 1260]], [[660, 960]], [[660, 1260]], [[660, 1260]], [[540, 960]], []], "status": "gonly", "status_label": "Google hours only", "status_note": "Hours come from Google Maps only; I couldn't find a second source (the shop's site or social page doesn't list them).", "notes": "Vintage mostly from the 70s to the 90s with known brands (Tommy Hilfiger, Nike, Levi's), on Hippodrome Square. Reviewers like the playful music and the €5 mystery boxes. It's tight for space and a bit pricey for second-hand, and one reviewer found a staff member pushy.", "sources": [["City Lockers guide", "https://blog.citylockers.gr/en/shopping-in-thessaloniki-the-thrift-shop-project/"]], "social": [], "gmaps": "https://www.google.com/maps/search/?api=1&query=Elephant%20Gang%20Ippodromiou%20Square%2018%2C%20546%2021%20Thessaloniki&query_place_id=ChIJmZtNdQE5qBQRZbd44uHGJOY", "cats": ["vintage", "streetwear"], "lat": 40.630205499999995, "lon": 22.9512598, "pid": "ChIJmZtNdQE5qBQRZbd44uHGJOY"}, {"n": 18, "name": "Thrift Store (Piniou)", "district": "564 30", "tags": ["Big thrift shop", "Fixed prices"], "rating": 4.1, "reviews": 286, "addr": "Piniou 9, 564 30 Thessaloniki", "phone": "+30 694 517 5598", "hours": [["Mon–Fri", "17:00–21:00"], ["Sat", "12:00–18:00"], ["Sun", "Closed"]], "sched": [[[1020, 1260]], [[1020, 1260]], [[1020, 1260]], [[1020, 1260]], [[1020, 1260]], [[720, 1080]], []], "status": "warn", "status_label": "Sources disagree", "status_note": "Google shows Mon–Fri 17:00–21:00 and Sat 12:00–18:00. Apple Maps and Tripadvisor list Mon–Fri 14:00–21:00 and Sat 12:00–20:00. One Google reviewer found it closed when it said open, so call first.", "notes": "A big, genuine thrift shop (one reviewer called it the only real thrift store they found in the city): lots of clothing, vintage and sports sections, plus boxes of cheaper items. Prices are fixed (no haggling), and reviewers mention outdoor and motorcycle gear. The lowest rating on this list, since finds depend on luck.", "sources": [["Tripadvisor", "https://www.tripadvisor.com/Attraction_Review-g189473-d27184490-Reviews-Thrift_Store-Thessaloniki_Thessaloniki_Region_Central_Macedonia.html"], ["Apple Maps", "https://maps.apple.com/place?place-id=I2FC8D7D3FB0119C0"]], "social": [], "gmaps": "https://www.google.com/maps/search/?api=1&query=Thrift%20Store%20Piniou%209%2C%20564%2030%20Thessaloniki&query_place_id=ChIJBygExaU5qBQR1xEj3ZxC2BY", "cats": ["vintage", "thrift"], "lat": 40.6413669, "lon": 22.9369619, "pid": "ChIJBygExaU5qBQR1xEj3ZxC2BY"}], "hotel": {"name": "Le   for(let i=1;i<=7;i++){const d=(now.d+i)%7;if(s.sched[d].length)return {open:false,text:'opens '+(i===1?'tomorrow':DAYS[d])+' '+fmt(s.sched[d][0][0])};}

document.getElementById('zreset').onclick=()=>{defaultView();sel=null;hotelSel=false;updateSheet();renderChips();render();};
const ptrs=new Map();let tap=null;
svg.addEventListener('pointerdown',ev=>{try{svg.setPointerCapture(ev.pointerId)}catch(e){}ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]);
  tap=ptrs.size===1?{t:Date.now(),moved:0}:null;});
svg.addEventListener('pointermove',ev=>{if(!ptrs.has(ev.pointerId))return;const prev=ptrs.get(ev.pointerId);const [cw,ch]=size();
  if(ptrs.size===1){const k=w/cw;cx-=(ev.clientX-prev[0])*k;cy-=(ev.clientY-prev[1])*k;if(tap)tap.moved+=Math.abs(ev.clientX-prev[0])+Math.abs(ev.clientY-prev[1]);render();}
  else if(ptrs.size===2){tap=null;const o=[...ptrs.entries()].find(([id])=>id!==ev.pointerId)[1];
    const d0=Math.hypot(prev[0]-o[0],prev[1]-o[1]),d1=Math.hypot(ev.clientX-o[0],ev.clientY-o[1]);
    if(d0>0){const r=svg.getBoundingClientRect();zoomBy(d1/d0,(ev.clientX+o[0])/2-r.left,(ev.clientY+o[1])/2-r.top);}}
  ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]);});
function hitTest(clientX,clientY){const r=svg.getBoundingClientRect(),[cw,ch]=size(),h=w*ch/cw;let best=null,bd=30;
  const cand=D.pins.map(p=>({id:p.n,x:+p.x,y:+p.y})).concat([{id:'H',x:HOTEL.x,y:HOTEL.y}]);
  cand.forEach(p=>{const sx=(p.x-(cx-w/2))/w*cw+r.left,sy=(p.y-(cy-h/2))/h*ch+r.top;const d=Math.hypot(sx-clientX,sy-clientY);if(d<bd){bd=d;best=p.id;}});return best;}
const up=ev=>{const was=tap;ptrs.delete(ev.pointerId);
  if(was&&was.moved<10&&Date.now()-was.t<600){const n=hitTest(ev.clientX,ev.clientY);if(n==='H')selectHotel(false);else if(n)select(n,false);}
  tap=null;};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',ev=>{ptrs.delete(ev.pointerId);tap=null;});
svg.addEventListener('wheel',ev=>{ev.preventDefault();const r=svg.getBoundingClientRect();zoomBy(ev.deltaY<0?1.2:1/1.2,ev.clientX-r.left,ev.clientY-r.top);},{passive:false});
function renderChips(){strip.querySelectorAll('.nchip').forEach(b=>b.classList.toggle('sel',hotelSel?b.dataset.n==='H':+b.dataset.n===sel));}
const sheet=document.getElementById('sheet');
function updateSheet(){
  if(!CITY)return;
  if(hotelSel){
    sheet.innerHTML=`<div class="t">H. ${esc(HOTEL.name)}</div><div class="m">${esc(HOTEL.addr)}</div>
    <div class="row"><button class="btn primary" data-dir="H">Directions</button><button class="btn" id="sclose">Close</button></div>`;
    document.getElementById('sclose').onclick=()=>{hotelSel=false;updateSheet();renderChips();render();};return;}
  if(!sel){sheet.innerHTML='<div class="m" style="margin:0">Tap a pin or a number above. H is the hotel. Tap Find me to see where you are. Pinch to zoom, drag to pan.</div>';return;}
  const s=S[sel-1];
  sheet.innerHTML=`<div class="t">${s.n}. ${esc(s.name)}</div>
  <div class="m">${s.rating.toFixed(1)} ★ (${s.reviews.toLocaleString()}) · ${esc(s.district)}</div>
  <div class="m" style="margin-top:-4px">${chip(s)}</div>
  <div class="m">${esc(s.addr)}<br>${esc(distText(s))}</div>
  <div class="row"><button class="btn primary" data-dir="${s.n}">Directions</button><button class="btn" id="sdet">Details</button></div>
  <div class="nav"><button class="btn" id="sprev">◀ ${s.n===1?S.length:s.n-1}</button><button class="btn" id="snext">${s.n===S.length?1:s.n+1} ▶</button></div>`;
  document.getElementById('sdet').onclick=()=>{tab('list');const el=cardEl(s.n);filt='all';document.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on',x.dataset.f==='all'));applyFilter();el.open=true;if(el.scrollIntoView)el.scrollIntoView({block:'start'});};
  document.getElementById('sprev').onclick=()=>select(s.n===1?S.length:s.n-1,true);
  document.getElementById('snext').onclick=()=>select(s.n===S.length?1:s.n+1,true);
}
function select(n,fly){sel=n;hotelSel=false;if(!inited)initMap();const p=D.pins[n-1];
  if(fly){const [cw,ch]=size();w=Math.min(w,Math.max(D.W,D.H*cw/ch));w=Math.min(w,450);cx=+p.x;cy=+p.y+(w*ch/cw)*0.12;}
  renderChips();updateSheet();render();
  const b=strip.querySelector(`.nchip[data-n="${n}"]`);if(b&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest'});}
function selectHotel(fly){hotelSel=true;sel=null;if(!inited)initMap();
  if(fly){const [cw,ch]=size();w=Math.min(w,Math.max(D.W,D.H*cw/ch));w=Math.min(w,900);cx=HOTEL.x;cy=HOTEL.y+(w*ch/cw)*0.12;}
  renderChips();updateSheet();render();
  const b=strip.querySelector('.nchip[data-n="H"]');if(b&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest'});}

const dirEl=document.getElementById('dirsheet'),dirBack=document.getElementById('dirback');
function closeDir(){dirEl.classList.remove('show');dirBack.classList.remove('show');}
function openDir(id){
  const t=id==='H'?{name:HOTEL.name,addr:HOTEL.addr,lat:HOTEL.lat,lon:HOTEL.lon,pid:HOTEL.pid}:(()=>{const s=S[id-1];return {name:s.name.split(' (')[0],addr:s.addr,lat:s.lat,lon:s.lon,pid:s.pid};})();
  const q=encodeURIComponent(t.name+', '+t.addr);
  const g=`https://www.google.com/maps/search/?api=1&query=${q}&query_place_id=${t.pid}`;
  const a=`https://maps.apple.com/?q=${q}&sll=${t.lat},${t.lon}`;
  dirEl.innerHTML=`<div class="t">Open ${esc(t.name)} in…</div>
  <a class="btn primary" href="${g}" target="_blank" rel="noopener">Google Maps</a>
  <a class="btn" href="${a}" target="_blank" rel="noopener">Apple Maps</a>
  <button class="btn" id="dircancel">Cancel</button>`;
  dirEl.classList.add('show');dirBack.classList.add('show');
  dirEl.querySelectorAll('a').forEach(x=>x.addEventListener('click',()=>setTimeout(closeDir,300)));
  document.getElementById('dircancel').onclick=closeDir;
}
dirBack.addEventListener('click',closeDir);
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-dir]');if(b){ev.preventDefault();openDir(b.dataset.dir==='H'?'H':+b.dataset.dir);}});

function findMe(done){
  if(!navigator.geolocation){toast('Location is not available on this device.');return;}
  toast('Finding you…',15000);
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude,lon=pos.coords.longitude,acc=pos.coords.accuracy||50,[x,y]=proj(lat,lon);
    me={lat,lon,acc,x,y};
    S.forEach(s=>{s.dMe=hav(lat,lon,s.lat,s.lon);});refreshDists();
    const near=S.slice().sort((a,b)=>a.dMe-b.dMe)[0];
    if(!inited)initMap();
    meG.style.display='';
    if(near.dMe>50000){toast(`You're about ${km(near.dMe)} from the nearest shop in ${CITY.short}, so the dot is off this map.`,7000);render();}
    else{const [cw,ch]=size();const dx=Math.abs(near.lon-lon)*P.KX,dy=Math.abs(near.lat-lat)*P.KY;
      w=Math.max(dx*2.4,dy*2.4*cw/ch,600);cx=(x+(+D.pins[near.n-1].x))/2;cy=(y+(+D.pins[near.n-1].y))/2;render();
      toast(`Nearest shop: ${near.n}. ${near.name} (${km(near.dMe)} away, in a straight line).`,6000);}
    if(done)done();
  },err=>{
    const msg={1:'Location is turned off for this app. You can allow it in iPhone Settings under Privacy & Security, Location Services.',
      2:"Couldn't work out your position. Try again with a better signal.",3:'Finding you took too long. Try again.'}[err.code]||'Something went wrong finding your location.';
    toast(msg,8000);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
document.getElementById('findme').onclick=()=>findMe();
window.addEventListener('resize',()=>{if(inited)render();});

/* city picker and loading */
const tabs=document.getElementById('tabs');
function renderPicker(){document.getElementById('citybtns').innerHTML=Object.keys(CITIES).map(k=>{const c=CITIES[k];
  const pin=`<span class="pinm" style="left:${c.pin.fx}%;top:${c.pin.fy}%"><svg viewBox="-8 -19 16 20" aria-hidden="true"><path d="M0 0C-3.5-4.5-6-7.6-6-11.2a6 6 0 1 1 12 0C6-7.6 3.5-4.5 0 0Z" fill="${c.pin.color}" stroke="#fff" stroke-width="1.5"/><circle cy="-11.2" r="2.2" fill="#fff"/></svg></span>`;
  return `<button class="city ${k}" data-city="${k}" aria-label="${esc(c.label)}"><div class="txt"><div class="cn">${esc(c.short)}</div><div class="cc">${esc(c.country)}</div><div class="ct">Top ${c.count} thrift stores</div></div><div class="shape"><div class="shp" style="--w:${c.shapeW};aspect-ratio:${c.shapeW}/60"><svg class="ol" viewBox="0 0 ${c.shapeW} 60" preserveAspectRatio="none" aria-hidden="true">${c.shape}</svg>${pin}</div></div></button>`;}).join('');}
document.getElementById('citybtns').addEventListener('click',ev=>{const b=ev.target.closest('.city');if(b)loadCity(b.dataset.city);});
function showPicker(){CITY=null;closeDir();
  ['v-list','v-map'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById('picker').classList.add('active');
  tabs.style.display='none';document.getElementById('locrow').style.display='none';document.getElementById('changecity').style.display='none';
  document.getElementById('sub').textContent='Pick a city to see its thrift stores';document.querySelector('header.top').classList.add('onpicker');}
document.getElementById('changecity').onclick=showPicker;
function loadCity(key){
  CITY=CITIES[key];S=CITY.shops;D=CITY.map;HOTEL=CITY.hotel;P=CITY.proj;me=null;
  S.forEach(s=>{s.dHotel=hav(HOTEL.lat,HOTEL.lon,s.lat,s.lon);s.dMe=null;});
  document.getElementById('locname').textContent=CITY.label;document.getElementById('locrow').style.display='flex';document.getElementById('changecity').style.display='flex';
  document.getElementById('sub').textContent=CITY.sub;document.querySelector('header.top').classList.remove('onpicker');
  document.getElementById('filters').innerHTML=CITY.filters.map(([f,l],i)=>`<button class="fchip${i===0?' on':''}" data-f="${f}">${esc(l)}</button>`).join('');
  list.innerHTML=S.map(cardHTML).join('');
  document.getElementById('considered').innerHTML=CITY.considered.map(([a,b,c])=>`<div><b>${esc(a)}${b?' · '+esc(b):''}</b><span>${esc(c)}</span></div>`).join('');
  document.getElementById('foot').textContent=CITY.foot;document.getElementById('mapnote').textContent=CITY.mapnote;
  filt='all';sortMode='rank';applyFilter();applySort();
  svg.innerHTML='';inited=false;sel=null;hotelSel=false;labels=[];lms=[];pinEls=[];
  strip.innerHTML='<button class="nchip h" data-n="H" aria-label="'+esc(HOTEL.name)+'">H</button>'+S.map(s=>`<button class="nchip" data-n="${s.n}" aria-label="${esc(s.name)}">${s.n}</button>`).join('');
  updateSheet();tabs.style.display='grid';tab('list');document.getElementById('v-list').scrollTop=0;
}
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{});}
renderPicker();showPicker();
</script>
</body></html>
